- name: Post-flight for Linux
  hosts: localhost
  tasks:
    - name: Linux Block
      when: ansible_os_family in ["RedHat", "Debian"]
      block:
        - name: Register python
          ansible.builtin.shell: pip3 show pip
          register: pv
        - name: Distribution major version
          debug: var=pv.stdout_lines
        - name: Distribution major version
          set_stats:
            data:
             lunch: tacos
