- name: Patch for Linux
  hosts: localhost
  become: true
  tasks:
    - name: Linux Block
      when: ansible_os_family in ["RedHat", "Debian"]
      block:
        - name: Distribution
          debug: msg="{{ ansible_distribution }}"
        - name: Distribution version
          debug: msg="{{ ansible_distribution_version}}"
        - name: Distribution major version
          debug: msg="{{ ansible_distribution_major_version }}"
        - name: Run nginx-install install via shell
          ansible.builtin.shell: pip3 install -U nginx-install
        - name: Create config file
          ansible.builtin.shell: nginx-install uninstall --dry
        - name: Run nginx install via shell
          ansible.builtin.shell: nginx-install install
